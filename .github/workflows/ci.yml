name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Evaluates the NixOS output and builds checks.lint (shellcheck, nixfmt).
      - run: nix flake check --print-build-logs
